{% extends "base.html" %}

{% block title %}Login - Gestão de Estoque AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
    /* ── PAGE WRAPPER ──────────────────────────────────── */
    .page-wrapper {
        min-height: calc(100vh - 68px - 70px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'DM Sans', sans-serif;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;
    }

    /* ambient glow blobs */
    .page-wrapper::before,
    .page-wrapper::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        pointer-events: none;
        z-index: 0;
    }

    .page-wrapper::before {
        width: 500px; height: 500px;
        background: radial-gradient(circle, rgba(59,130,246,0.12), transparent 70%);
        top: -120px; left: -100px;
        animation: blobMove 12s ease-in-out infinite alternate;
    }

    .page-wrapper::after {
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(139,92,246,0.08), transparent 70%);
        bottom: -80px; right: -80px;
        animation: blobMove 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobMove {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(30px, 20px) scale(1.08); }
    }

    /* ── AUTH CARD ─────────────────────────────────────── */
    .auth-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        background: rgba(13, 19, 32, 0.9);
        border: 1px solid rgba(99, 179, 237, 0.12);
        padding: 48px 40px 40px;
        border-radius: 24px;
        text-align: center;
        box-shadow:
            0 0 0 1px rgba(255,255,255,0.03),
            0 40px 80px rgba(0,0,0,0.6),
            0 0 60px rgba(59,130,246,0.06);
        animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
    }

    @keyframes cardIn {
        from { opacity: 0; transform: translateY(24px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* top accent line */
    .auth-card::before {
        content: '';
        position: absolute;
        top: 0; left: 10%; right: 10%;
        height: 1px;
        background: linear-gradient(90deg,
            transparent,
            rgba(59, 130, 246, 0.6),
            rgba(139, 92, 246, 0.4),
            transparent);
        border-radius: 0 0 2px 2px;
    }

    /* ── BRAND ICON ────────────────────────────────────── */
    .brand-icon {
        width: 52px; height: 52px;
        border-radius: 14px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.22);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        color: #60a5fa;
        font-size: 21px;
        box-shadow: 0 0 24px rgba(59, 130, 246, 0.18);
        transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .brand-icon:hover {
        box-shadow: 0 0 36px rgba(59, 130, 246, 0.32);
        transform: scale(1.04);
    }

    .auth-card h2 {
        font-family: 'Syne', sans-serif;
        color: #f0f6ff;
        margin: 0 0 8px 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .auth-card h2 span { color: #60a5fa; }

    .auth-card .subtitle {
        color: #64748b;
        font-size: 13.5px;
        line-height: 1.6;
        margin: 0 0 36px 0;
        padding: 0 6px;
    }

    /* ── ACTION BUTTONS ────────────────────────────────── */
    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 260px;
        margin: 0 auto;
    }

    /* Primary: solid accent with shimmer */
    .btn-prime {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: #fff;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        font-family: 'DM Sans', sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        transition: all 0.25s ease;
        border: 1px solid rgba(59, 130, 246, 0.4);
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25),
                    inset 0 1px 0 rgba(255,255,255,0.12);
        letter-spacing: 0.01em;
    }

    .btn-prime::after {
        content: '';
        position: absolute;
        top: 0; left: -75%;
        width: 50%;
        height: 100%;
        background: linear-gradient(90deg,
            transparent,
            rgba(255,255,255,0.18),
            transparent);
        transform: skewX(-20deg);
        transition: left 0.55s ease;
    }

    .btn-prime:hover::after { left: 125%; }

    .btn-prime:hover {
        background: linear-gradient(135deg, #60a5fa, #3b82f6);
        box-shadow: 0 6px 24px rgba(59, 130, 246, 0.4),
                    inset 0 1px 0 rgba(255,255,255,0.15);
        transform: translateY(-2px);
    }

    .btn-prime:active { transform: translateY(0); }

    /* Secondary: ghost style */
    .btn-sub {
        position: relative;
        overflow: hidden;
        background: transparent;
        color: #94a3b8;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        font-family: 'DM Sans', sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid rgba(99, 179, 237, 0.1);
        transition: all 0.25s ease;
        letter-spacing: 0.01em;
    }

    .btn-sub::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(59, 130, 246, 0.0);
        transition: background 0.25s ease;
        border-radius: 10px;
    }

    .btn-sub:hover {
        color: #e2e8f0;
        border-color: rgba(99, 179, 237, 0.25);
        background: rgba(59, 130, 246, 0.06);
        transform: translateY(-1px);
    }

    /* ── FOOTER BADGE ──────────────────────────────────── */
    .card-footer {
        margin-top: 36px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .version-tag {
        font-size: 10px;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 600;
    }

    .pulse-dot {
        width: 5px; height: 5px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 6px #10b981;
        animation: pulse 2.2s ease infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── FEATURES ROW ──────────────────────────────────── */
    .features {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 0 0 32px;
        flex-wrap: wrap;
    }

    .feature-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(99, 179, 237, 0.05);
        border: 1px solid rgba(99, 179, 237, 0.1);
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 11.5px;
        color: #64748b;
        font-weight: 500;
    }

    .feature-chip i {
        color: #3b82f6;
        font-size: 10px;
    }
</style>

<div class="page-wrapper">
    <div class="auth-card">

        <div class="brand-icon">
            <i class="fas fa-layer-group"></i>
        </div>

        <h2>Estoque <span>AAPM</span></h2>

        <p class="subtitle">
            Controle de ativos e materiais<br>de forma simples e automatizada.
        </p>

        <div class="features">
            <span class="feature-chip"><i class="fas fa-circle-check"></i> Tempo real</span>
            <span class="feature-chip"><i class="fas fa-shield-halved"></i> Seguro</span>
            <span class="feature-chip"><i class="fas fa-chart-line"></i> Relatórios</span>
        </div>

        <div class="btn-group">
            <a href="/auth/login" class="btn-prime">
                <i class="fas fa-shield" style="font-size: 12px;"></i>
                <span>Entrar no sistema</span>
            </a>

            <a href="/auth/cadastro" class="btn-sub">
                <i class="fas fa-user-plus" style="font-size: 12px;"></i>
                <span>Criar conta</span>
            </a>
        </div>

        <div class="card-footer">
            <span class="pulse-dot"></span>
            <span class="version-tag">v2.0 &nbsp;·&nbsp; AAPM Engine</span>
        </div>

    </div>
</div>
{% endblock %}
