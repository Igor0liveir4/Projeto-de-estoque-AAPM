{% extends "base.html" %}

{% block title %}Login - Projeto de Estoque AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div style="max-width: 500px; margin: 40px auto; perspective: 1000px;">
    <div style="
        background: rgba(255, 255, 255, 0.98);
        padding: 50px 40px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        text-align: center;
        border: 1px solid rgba(102, 126, 234, 0.1);
        position: relative;
        overflow: hidden;
    ">
        <div style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #28a745);
        "></div>

        <div style="
            background: #f0f4ff;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #667eea;
            font-size: 35px;
        ">
            <i class="fas fa-boxes-stacked"></i>
        </div>

        <h2 style="
            color: #1a202c; 
            margin-bottom: 10px; 
            font-size: 30px; 
            font-weight: 800;
            letter-spacing: -1px;
        ">
            Sistema de <span style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Estoque 📚🏓</span>
        </h2>
        
        <p style="color: #718096; font-size: 16px; margin-bottom: 40px; line-height: 1.5;">
            Gerencie seu inventário com a precisão e a facilidade que o seu projeto exige.
        </p>

        <div style="display: flex; flex-direction: column; gap: 15px;">
            <a href="/auth/login" style="
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 16px 24px;
                text-decoration: none;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 25px rgba(102, 126, 234, 0.5)'" 
               onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(102, 126, 234, 0.4)'">
                <i class="fas fa-key"></i> Acessar Sistema
            </a>

            <a href="/auth/cadastro" style="
                background-color: transparent;
                color: #2d3748;
                padding: 16px 24px;
                text-decoration: none;
                border-radius: 12px;
                font-size: 16px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                border: 2px solid #e2e8f0;
                transition: all 0.3s ease;
            " onmouseover="this.style.backgroundColor='#f7fafc'; this.style.borderColor='#cbd5e0'; this.style.color='#1a202c'" 
               onmouseout="this.style.backgroundColor='transparent'; this.style.borderColor='#e2e8f0'; this.style.color='#2d3748'">
                <i class="fas fa-user-plus"></i> Criar Nova Conta
            </a>
        </div>

        <div style="margin-top: 30px; border-top: 1px solid #edf2f7; padding-top: 20px;">
            <p style="font-size: 12px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px;">
                AAPM &copy; 2026 - Gestão Inteligente
            </p>
        </div>
    </div>
</div>
{% endblock %}
