{% extends "base.html" %}

{% block title %}Login - Projeto de Estoque AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<div style="
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
">
    <div style="
        width: 100%;
        max-width: 450px;
        position: relative;
        padding: 20px;
    ">
        <div
            style="position: absolute; width: 150px; height: 150px; background: #667eea; filter: blur(80px); border-radius: 50%; top: -20px; left: -20px; z-index: 0; opacity: 0.4;">
        </div>
        <div
            style="position: absolute; width: 150px; height: 150px; background: #764ba2; filter: blur(80px); border-radius: 50%; bottom: -20px; right: -20px; z-index: 0; opacity: 0.4;">
        </div>

        <div style="
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 1;
        ">
            <div style="
                margin: 0 auto 30px;
                width: 70px;
                height: 70px;
                border-radius: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            ">
                <i class="fas fa-boxes-stacked" style="color: white; font-size: 32px;"></i>
            </div>

            <h2 style="
                color: #111827; 
                margin-bottom: 12px; 
                font-size: 32px; 
                font-weight: 800;
                letter-spacing: -1.5px;
                line-height: 1;
            ">
                Estoque <span
                    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AAPM</span>
            </h2>

            <p style="color: #6b7280; font-size: 15px; margin-bottom: 40px; font-weight: 400;">
                A plataforma inteligente para controle de ativos e materiais.
            </p>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <a href="/auth/login" style="
                    background: #111827;
                    color: white;
                    padding: 16px;
                    text-decoration: none;
                    border-radius: 16px;
                    font-size: 16px;
                    font-weight: 600;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 12px;
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    border: 1px solid transparent;
                " onmouseover="this.style.background='#374151'; this.style.transform='scale(1.02)'"
                    onmouseout="this.style.background='#111827'; this.style.transform='scale(1)'">
                    <i class="fas fa-fingerprint"></i> Entrar na Conta
                </a>

                <a href="/auth/cadastro" style="
                    background: white;
                    color: #111827;
                    padding: 16px;
                    text-decoration: none;
                    border-radius: 16px;
                    font-size: 16px;
                    font-weight: 600;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 12px;
                    border: 1px solid #e5e7eb;
                    transition: all 0.3s ease;
                " onmouseover="this.style.borderColor='#667eea'; this.style.backgroundColor='#f9fafb'"
                    onmouseout="this.style.borderColor='#e5e7eb'; this.style.backgroundColor='white'">
                    <i class="fas fa-plus-circle"></i> Começar Agora
                </a>
            </div>

            <div style="margin-top: 35px;">
                <p
                    style="font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;">
                    Projeto - AAPM v2.0
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
