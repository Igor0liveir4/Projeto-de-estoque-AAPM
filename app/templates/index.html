
{% extends "base.html" %}

{% block title %}Login - Gestão de Estoque AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .page-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #558afd; /* Fundo escuro premium */
        padding: 20px;
    }
    
    .auth-card {
        width: 100%;
        max-width: 400px;
        background: #1b1b1b; /* Superfície interna contrastante */
        border: 1px solid rgba(255, 255, 255, 0.05); /* Borda cirúrgica e sutil */
        padding: 40px 32px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    /* Brilho de fundo sutil (Aura) */
    .auth-card::before {
        content: '';
        position: absolute;
        top: -10%;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 180px;
        background: #3b82f6;
        filter: blur(90px);
        opacity: 0.15;
        pointer-events: none;
    }

    .brand-icon {
        color: #f8fafc;
        font-size: 20px;
        background: rgba(255, 255, 255, 0.03);
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 24px;
    }

    /* Botões Pequenos e Minimalistas */
    .btn-prime {
        background: #f8fafc;
        color: #090d16;
        padding: 10px 16px;
        text-decoration: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
    }
    .btn-prime:hover {
        background: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    .btn-sub {
        background: transparent;
        color: #94a3b8;
        padding: 10px 16px;
        text-decoration: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.2s ease;
    }
    .btn-sub:hover {
        background: rgba(255, 255, 255, 0.03);
        color: #f8fafc;
        border-color: rgba(255, 255, 255, 0.2);
    }
</style>

<div class="page-wrapper">
    <div class="auth-card">
        
        <div class="brand-icon">
            <i class="fas fa-layer-group"></i>
        </div>

        <h2 style="color: #f8fafc; margin: 0 0 8px 0; font-size: 24px; font-weight: 600; letter-spacing: -0.5px;">
            Estoque AAPM
        </h2>

        <p style="color: #64748b; font-size: 13px; line-height: 1.5; margin: 0 0 32px 0; padding: 0 10px;">
            Controle de ativos e materiais de forma simples e automatizada.
        </p>

        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 240px; margin: 0 auto;">
            <a href="/auth/login" class="btn-prime">
                <i class="fas fa-shield" style="font-size: 11px;"></i>
                <span>Entrar no sistema</span>
            </a>

            <a href="/auth/cadastro" class="btn-sub">
                <span>Criar conta</span>
            </a>
        </div>

        <div style="margin-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.03); padding-top: 16px;">
            <p style="font-size: 10px; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; margin: 0; font-weight: 500;">
                v2.0 • AAPM Engine
            </p>
        </div>

    </div>
</div>
{% endblock %}
