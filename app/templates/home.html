{% extends "base.html" %}

{% block title %}Início - Projeto de Estoque AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div style="
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    border: 1px solid rgba(255, 255, 255, 0.3);
    max-width: 600px;
    margin: 20px auto;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
">
    
    <div style="display: flex; align-items: center; margin-bottom: 25px;">
        <div style="
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
        ">
            <i class="fas fa-user-rocket"></i>
        </div>
        <div>
            <h2 style="color: #2d3748; margin: 0; font-size: 28px; letter-spacing: -0.5px;">
                Olá, <span style="color: #667eea;">{{ usuario.nome }}</span>!
            </h2>
            <p style="margin: 5px 0 0 0; color: #718096; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                Bem-vindo ao Dashboard
            </p>
        </div>
    </div>
    
    <div style="
        background: #f8fafc;
        padding: 15px 20px;
        border-radius: 12px;
        margin-bottom: 30px;
        border-left: 5px solid #667eea;
        display: flex;
        align-items: center;
    ">
        <i class="fas fa-shield-alt" style="color: #667eea; margin-right: 12px;"></i>
        <p style="font-size: 15px; margin: 0; color: #4a5568;">
            <strong>Perfil de Acesso:</strong> 
            <span style="background: #ebf4ff; color: #5a67d8; padding: 2px 8px; border-radius: 4px; font-weight: 600; font-size: 13px; margin-left: 5px;">
                {{ usuario.role }}
            </span>
        </p>
    </div>

    <div style="display: flex; gap: 15px;">
        <a href="/usuarios" style="
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(102, 126, 234, 0.4)'" 
           onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(102, 126, 234, 0.3)'">
            <i class="fas fa-th-list"></i> Tela de Cadastro
        </a>

        <a href="/auth/logout" style="
            background-color: #ffffff;
            color: #dc3545;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #fee2e2;
            transition: all 0.3s ease;
        " onmouseover="this.style.backgroundColor='#fff5f5'; this.style.borderColor='#dc3545'" 
           onmouseout="this.style.backgroundColor='#ffffff'; this.style.borderColor='#fee2e2'">
            <i class="fas fa-sign-out-alt"></i> Sair
        </a>
    </div>
</div>
{% endblock %}
