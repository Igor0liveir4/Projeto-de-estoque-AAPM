{% extends "base.html" %}

{% block title %}Registrar Movimentação - AAPM{% endblock %}

{% block head %}

<link rel="stylesheet" href="/static/css/movimentacoes_form.css">

{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        
        <div class="form-header">
            <div class="form-title">
                <i class="fas fa-boxes movimentacoes_form-inline-a30ebbaad3"></i>
                Registrar Movimentação de Estoque
            </div>
        </div>

        <form action="/movimentacoes/nova" method="POST" data-confirm-message="Confirma o registro desta movimentacao?">
            
            <div class="form-group">
                <label>Tipo de Movimentação</label>
                <div class="radio-group">
                    <label class="movimentacoes_form-inline-9a3e6ebfd3">
                        <input type="radio" name="tipo" value="entrada" checked class="movimentacoes_form-inline-c8be1ccba6">
                        <span class="radio-label"><i class="fas fa-arrow-down movimentacoes_form-inline-2b594c3752"></i> Entrada</span>
                    </label>
                    <label class="movimentacoes_form-inline-9a3e6ebfd3">
                        <input type="radio" name="tipo" value="saida" class="movimentacoes_form-inline-c8be1ccba6">
                        <span class="radio-label"><i class="fas fa-arrow-up movimentacoes_form-inline-5b0d98b65a"></i> Saída</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="produto_id">Produto</label>
                <select name="produto_id" id="produto_id" required>
                    <option value="" disabled selected>Selecione um produto...</option>
                    {% for produto in produtos %}
                        <!-- ✅ data-preco carrega o preço direto do banco -->
                        <option value="{{ produto.id }}" data-preco="{{ produto.preco }}">
                            {{ produto.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" name="quantidade" id="quantidade" min="1" placeholder="Ex: 10" required>
            </div>

            <div class="form-group">
                <label for="preco_unitario">Preço Unitário (R$)</label>
                <input type="number" name="preco_unitario" id="preco_unitario" step="0.01" min="0.00" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="observacao">Observação</label>
                <textarea name="observacao" id="observacao" rows="3" maxlength="255" placeholder="Alguma informação relevante sobre essa movimentação..."></textarea>
            </div>

            <div class="actions-bar">
                <a href="/movimentacoes" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Gravar Movimentação
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    // Alterna estilo visual dos radio buttons
    const radios = document.querySelectorAll('input[type="radio"]');
    radios.forEach(radio => {
        radio.addEventListener('change', function() {
            radios.forEach(r => r.nextElementSibling.style.borderColor = 'var(--border)');
            radios.forEach(r => r.nextElementSibling.style.background = 'var(--bg-surface)');
            radios.forEach(r => r.nextElementSibling.style.color = 'var(--text-secondary)');
            
            if(this.checked) {
                this.nextElementSibling.style.borderColor = 'var(--accent)';
                this.nextElementSibling.style.background = 'rgba(59,130,246,0.12)';
                this.nextElementSibling.style.color = 'var(--accent-light)';
            }
        });
    });

    // ✅ Preenche o preço automaticamente ao selecionar o produto
    const selectProduto = document.getElementById('produto_id');
    const inputPreco    = document.getElementById('preco_unitario');
    selectProduto.addEventListener('change', function() {
        const preco = this.options[this.selectedIndex].dataset.preco;
        inputPreco.value = preco ? parseFloat(preco).toFixed(2) : '';
    });
</script>
{% endblock %}
