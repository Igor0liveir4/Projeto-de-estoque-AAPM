{% extends "base.html" %}

{% block title %}Registrar Movimentação - AAPM{% endblock %}

{% block head %}
<style>
    .form-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .form-header {
        border-bottom: 2px solid #f0f2f5;
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    .form-title {
        color: #333;
        font-size: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #444;
    }

    .radio-group {
        display: flex;
        gap: 20px;
        margin: 10px 0;
    }

    .radio-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 500 !important;
        background: #f8f9fa;
        padding: 10px 20px;
        border: 1px solid #ddd;
        border-radius: 6px;
        width: 100%;
        justify-content: center;
        transition: all 0.2s;
    }

    input[type="radio"] {
        width: auto;
        margin: 0;
    }

    input[type="radio"]:checked + .radio-label {
        border-color: #667eea;
        background-color: #f0f4ff;
        color: #667eea;
    }

    .actions-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
        gap: 15px;
    }

    .btn-submit {
        background: linear-gradient(135deg, #558afd 0%, #667eea 100%);
        font-weight: 600;
        padding: 12px 25px;
        flex-grow: 1;
    }

    .btn-cancelar {
        background-color: #6c757d;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 4px;
        font-weight: 500;
        text-align: center;
        transition: background 0.3s;
    }

    .btn-cancelar:hover {
        background-color: #5a6268;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        
        <div class="form-header">
            <div class="form-title">
                <i class="fas fa-boxes" style="color: #e45a5a;"></i>
                Registrar Movimentação de Estoque
            </div>
        </div>

        <form action="/movimentacoes/nova" method="POST">
            
            <div class="form-group">
                <label>Tipo de Movimentação</label>
                <div class="radio-group">
                    <label style="width: 50%; padding:0;">
                        <input type="radio" name="tipo" value="entrada" checked style="display:none;">
                        <span class="radio-label"><i class="fas fa-arrow-down" style="color: #28a745;"></i> Entrada</span>
                    </label>
                    <label style="width: 50%; padding:0;">
                        <input type="radio" name="tipo" value="saida" style="display:none;">
                        <span class="radio-label"><i class="fas fa-arrow-up" style="color: #dc3545;"></i> Saída</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="produto_id">Produto</label>
                <select name="produto_id" id="produto_id" required>
                    <option value="" disabled selected>Selecione um produto...</option>
                    {% for produto in produtos %}
                        <!-- ✅ data-preco carrega o preço direto do banco -->
                        <option value="{{ produto.id }}" data-preco="{{ produto.preco }}">
                            {{ produto.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade</label>
                <input type="number" name="quantidade" id="quantidade" min="1" placeholder="Ex: 10" required>
            </div>

            <div class="form-group">
                <label for="preco_unitario">Preço Unitário (R$)</label>
                <input type="number" name="preco_unitario" id="preco_unitario" step="0.01" min="0.00" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label for="observacao">Observação</label>
                <textarea name="observacao" id="observacao" rows="3" maxlength="255" placeholder="Alguma informação relevante sobre essa movimentação..."></textarea>
            </div>

            <div class="actions-bar">
                <a href="/movimentacoes" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save"></i> Gravar Movimentação
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    // Alterna estilo visual dos radio buttons
    const radios = document.querySelectorAll('input[type="radio"]');
    radios.forEach(radio => {
        radio.addEventListener('change', function() {
            radios.forEach(r => r.nextElementSibling.style.borderColor = '#ddd');
            radios.forEach(r => r.nextElementSibling.style.background = '#f8f9fa');
            radios.forEach(r => r.nextElementSibling.style.color = '#333');
            
            if(this.checked) {
                this.nextElementSibling.style.borderColor = '#667eea';
                this.nextElementSibling.style.background = '#f0f4ff';
                this.nextElementSibling.style.color = '#667eea';
            }
        });
    });

    // ✅ Preenche o preço automaticamente ao selecionar o produto
    const selectProduto = document.getElementById('produto_id');
    const inputPreco    = document.getElementById('preco_unitario');

    selectProduto.addEventListener('change', function() {
        const preco = this.options[this.selectedIndex].dataset.preco;
        inputPreco.value = preco ? parseFloat(preco).toFixed(2) : '';
    });
</script>
{% endblock %}
