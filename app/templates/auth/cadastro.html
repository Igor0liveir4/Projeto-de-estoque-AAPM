{% extends "base.html" %}

{% block title %}Cadastro - Projeto de Estoque AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .page-wrapper {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #090d16; /* Mesmo fundo escuro premium */
        padding: 20px;
    }
    
    .register-card {
        width: 100%;
        max-width: 420px;
        background: #111726; /* Mesma superfície interna */
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 40px 32px;
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    /* Brilho de fundo sutil (Aura) igual às telas anteriores */
    .register-card::before {
        content: '';
        position: absolute;
        top: -10%;
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: 180px;
        background: #3b82f6;
        filter: blur(90px);
        opacity: 0.12;
        pointer-events: none;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        font-size: 12px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.02em;
    }

    /* Inputs Modernos, Transparentes e Alinhados */
    .form-control {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        color: #f8fafc;
        font-family: inherit;
        transition: all 0.2s ease;
        width: 100%;
        box-sizing: border-box;
    }

    .form-control:focus {
        outline: none;
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Botão de Envio Pequeno e Minimalista */
    .btn-submit {
        background: #f8fafc;
        color: #090d16;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    /* Link de login secundário sutil */
    .login-link {
        color: #64748b;
        font-size: 13px;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .login-link a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
    }

    .login-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="page-wrapper">
    <div class="register-card">
        
        <div style="text-align: center; margin-bottom: 32px;">
            <h2 style="color: #f8fafc; margin: 0 0 6px 0; font-size: 24px; font-weight: 600; letter-spacing: -0.5px;">
                Criar Conta
            </h2>
            <p style="color: #64748b; font-size: 13px; margin: 0;">
                Preencha os dados abaixo para acessar o sistema
            </p>
        </div>

        <form action="/auth/cadastro" method="POST" style="display: flex; flex-direction: column;">
            
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="Seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail corporativo</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="nome@aapm.com" required>
            </div>
            
            <div class="form-group" style="margin-bottom: 28px;">
                <label for="senha">Senha de acesso</label>
                <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div style="display: flex; justify-content: center;">
                <button type="submit" class="btn-submit" style="width: 100%; max-width: 240px;">
                    <span>Finalizar cadastro</span>
                    <i class="fas fa-check" style="font-size: 11px;"></i>
                </button>
            </div>
        </form>
        
        <div style="margin-top: 32px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.03); padding-top: 20px;">
            <p class="login-link">
                Já tem uma conta? <a href="/auth/login">Faça login aqui</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
