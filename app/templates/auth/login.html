{% extends "base.html" %}

{% block title %}Login - Projeto de Estoque AAPM{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/auth_login.css">
{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">





<div class="page-wrapper">
    <div class="login-card">
        
        <div class="auth_login-inline-8fb5d7c6da">
            <h2 class="auth_login-inline-ba723702cb">
                Acessar Conta
            </h2>
            <p class="auth_login-inline-42d8c5ff29">
                Insira suas credenciais para continuar
            </p>
        </div>

        <form action="/auth/login" method="POST" class="auth_login-inline-ba30f188c7">
            
            <div class="form-group">
                <label for="email">E-mail institucional</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="nome@exemplo.com" required>
            </div>
            
            <div class="form-group auth_login-inline-3e43f6f83f">
                <label for="senha">Senha de acesso</label>
                <div class="password-field">
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" aria-label="Mostrar senha" aria-controls="senha">
                        <i class="fas fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            
            <div class="auth_login-inline-63b79a9724">
                <button type="submit" class="btn-submit auth_login-inline-0414ab9f84">
                    <span>Entrar no painel</span>
                    <i class="fas fa-sign-in-alt auth_login-inline-e9e0e4af65"></i>
                </button>
            </div>
        </form>

        <div class="auth_login-inline-5dc2db64ba">
            <a href="{{ url_for('tela_home') }}" class="auth_login-inline-698ab34756">
                <i class="fas fa-arrow-left auth_login-inline-cdc34a99ce"></i>
                Voltar para a página inicial
            </a>
        </div>

    </div>
</div>
<script>
    const passwordInput = document.getElementById('senha');
    const togglePasswordButton = document.querySelector('.toggle-password');

    togglePasswordButton.addEventListener('click', () => {
        const showingPassword = passwordInput.type === 'text';
        passwordInput.type = showingPassword ? 'password' : 'text';
        togglePasswordButton.setAttribute('aria-label', showingPassword ? 'Mostrar senha' : 'Ocultar senha');
        togglePasswordButton.querySelector('i').className = showingPassword ? 'fas fa-eye' : 'fas fa-eye-slash';
    });
</script>
{% endblock %}
