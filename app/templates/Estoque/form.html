{% extends "base.html" %}

{% block title %}Movimentar Estoque - AAPM{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    .page-wrapper {
        min-height: 85vh;
        background-color: #090d16; /* Fundo padrão premium */
        font-family: 'Plus Jakarta Sans', sans-serif;
        padding: 40px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .form-card {
        background: #111726; /* Superfície interna escura */
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 40px 35px;
        border-radius: 24px;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    }

    .form-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .form-header h2 {
        color: #f8fafc;
        font-weight: 600;
        font-size: 22px;
        margin: 0 0 6px 0;
        letter-spacing: -0.5px;
    }

    .form-header p {
        color: #64748b;
        font-size: 13px;
        margin: 0;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-label {
        display: block;
        font-weight: 500;
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 8px;
    }

    /* Custom Inputs e Selects adaptados para Dark Mode */
    .form-control {
        width: 100%;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        outline: none;
        font-size: 14px;
        color: #f8fafc;
        font-family: inherit;
        box-sizing: border-box;
        transition: all 0.2s ease;
    }

    .form-control:focus {
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Ajuste para opções nativas do Select no Dark Mode */
    select.form-control option {
        background: #111726;
        color: #f8fafc;
    }

    /* Botão Dinâmico Principal */
    .btn-submit {
        width: 100%;
        background: #f8fafc;
        color: #090d16;
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        font-family: inherit;
    }

    .btn-submit:hover {
        background: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    /* Link Cancelar Sutil */
    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #64748b;
        text-decoration: none;
        font-weight: 500;
        font-size: 13px;
        transition: color 0.2s;
    }

    .btn-cancel:hover {
        color: #94a3b8;
    }
</style>

<div class="page-wrapper">
    <div class="form-card">
        
        <div class="form-header">
            <h2>Registrar Movimentação</h2>
            <p>Lançamento de fluxo de entrada ou saída para auditoria.</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label class="form-label">Natureza da Operação</label>
                <select name="tipo" id="tipoMovimentacao" class="form-control" onchange="atualizarEstiloBotao()">
                    <option value="entrada">Aporte (+) Entrada de Material</option>
                    <option value="saida">Retirada (-) Saída de Material</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Ativo / Produto</label>
                <select name="produto_id" class="form-control">
                    {% for p in produtos %}
                        <option value="{{ p.id }}">{{ p.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 32px;">
                <label class="form-label">Quantidade Volumétrica</label>
                <input type="number" name="quantidade" placeholder="0" min="1" required class="form-control">
            </div>

            <button type="submit" id="btnSalvar" class="btn-submit">
                <i class="fas fa-layer-group" style="font-size: 13px;"></i>
                <span>Confirmar Lançamento</span>
            </button>
            
            <a href="/estoque" class="btn-cancel">Cancelar operação</a>
        </form>
    </div>
</div>

<script>
    // Pequeno detalhe de UX para dar dinamismo ao formulário dependendo da ação do usuário
    function atualizarEstiloBotao() {
        const tipo = document.getElementById('tipoMovimentacao').value;
        const btn = document.getElementById('btnSalvar');
        
        if (tipo === 'entrada') {
            btn.style.background = '#f8fafc';
            btn.style.color = '#090d16';
        } else {
            // Se for saída, dá um tom levemente cinza/azul para diferenciar visualmente a criticidade
            btn.style.background = 'rgba(255, 255, 255, 0.08)';
            btn.style.color = '#f8fafc';
            btn.style.border = '1px solid rgba(255, 255, 255, 0.1)';
        }
    }
    
    // Inicializa o estado no carregamento da página
    window.onload = atualizarEstiloBotao;
</script>
{% endblock %}
