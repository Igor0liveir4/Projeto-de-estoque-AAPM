<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de Estoque AAPM{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block head %}{% endblock %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #558afd;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #558afd 0%, #e45a5a 100%);
            color: rgb(255, 255, 255);
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Alinha a logo e o texto horizontalmente */
        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-header {
            height: 50px; /* Ajuste a altura máxima conforme necessário */
            width: auto;
            object-fit: contain;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: rgb(255, 255, 255);
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .nav-btn.logout {
            background-color: rgba(220, 38, 38, 0.15);
            border-color: rgba(220, 38, 38, 0.3);
        }

        .nav-btn.logout:hover {
            background-color: rgba(220, 38, 38, 0.25);
            border-color: rgba(220, 38, 38, 0.5);
        }

        main {
            padding: 0;
            min-height: calc(100vh - 150px);
        }

        footer {
            background-color: #353535;
            color: rgb(255, 255, 255);
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        .alert {
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        button,
        .btn {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin: 20px 0;
        }

        table th {
            background-color: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        /* Responsividade*/
        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            h1 {
                font-size: 22px;
            }

            .nav-buttons {
                width: 100%;
                justify-content: center;
            }

            .nav-btn {
                padding: 8px 14px;
                font-size: 13px;
            }

            nav ul {
                gap: 15px;
                padding: 10px 0;
            }

            nav a {
                font-size: 14px;
            }

            header {
                padding: 15px 0;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-top">
                <div class="header-content">
                    <img src="/static/logo/logoaapm.png" alt="Logo AAPM" class="logo-header">
                    <h1>Gestão de Estoque AAPM</h1>
                </div>
                {% if usuario %}
                <div class="nav-buttons">
                    <a href="/" class="nav-btn">
                        <i class="fas fa-home"></i> Home
                    </a>
                    <a href="/cliente" class="nav-btn">
                        <i class="fas fa-boxes"></i> Clientes
                    </a>
                    <a href="/produtos" class="nav-btn">
                        <i class="fas fa-package"></i> Produtos
                    </a>
                    <a href="/categorias" class="nav-btn">
                        <i class="fas fa-list"></i> Categorias
                    </a>
                    <a href="/usuarios" class="nav-btn">
                        <i class="fas fa-users"></i> Usuários
                    </a>
                    <a href="/auth/logout" class="nav-btn logout">
                        <i class="fas fa-sign-out-alt"></i> Sair
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Gestão de Estoque AAPM. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
