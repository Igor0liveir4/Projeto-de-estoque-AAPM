<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de Estoque AAPM{% endblock %}</title>
    {% block head %}{% endblock %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base:       #080c14;
            --bg-surface:    #0d1320;
            --bg-card:       #111827;
            --bg-card-hover: #161f30;
            --border:        rgba(99, 179, 237, 0.1);
            --border-hover:  rgba(99, 179, 237, 0.28);
            --accent:        #3b82f6;
            --accent-glow:   rgba(59, 130, 246, 0.35);
            --accent-light:  #60a5fa;
            --red:           #ef4444;
            --red-glow:      rgba(239, 68, 68, 0.3);
            --text-primary:  #f0f6ff;
            --text-secondary:#94a3b8;
            --text-muted:    #475569;
            --header-h:      68px;
            --radius:        12px;
            --radius-lg:     18px;
            --transition:    0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            /* subtle grid texture */
            background-image:
                linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── HEADER ─────────────────────────────────────── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-h);
            background: rgba(8, 12, 20, 0.85);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 0 0 rgba(59,130,246,0.06);
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-header {
            height: 36px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        h1 span {
            color: var(--accent-light);
        }

        /* ── NAV BUTTONS ────────────────────────────────── */
        .nav-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-btn {
            position: relative;
            background: transparent;
            color: var(--text-secondary);
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            transition: color var(--transition), background var(--transition), transform var(--transition);
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* shimmer sweep on hover */
        .nav-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg,
                transparent 30%,
                rgba(255,255,255,0.07) 50%,
                transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.45s ease;
        }

        .nav-btn:hover::after { transform: translateX(100%); }

        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(59, 130, 246, 0.10);
            border-color: var(--border);
            transform: translateY(-1px);
        }

        .nav-btn i {
            font-size: 13px;
            opacity: 0.8;
        }

        .nav-btn.active {
            color: var(--accent-light);
            background: rgba(59, 130, 246, 0.12);
            border-color: rgba(59, 130, 246, 0.25);
        }

        .nav-btn.logout {
            color: #fca5a5;
            margin-left: 6px;
        }

        .nav-btn.logout:hover {
            color: #fff;
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.28);
        }

        .nav-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 4px;
        }

        /* ── MAIN ───────────────────────────────────────── */
        main {
            padding: 0;
            min-height: calc(100vh - var(--header-h) - 70px);
        }

        /* ── FOOTER ─────────────────────────────────────── */
        footer {
            background: var(--bg-surface);
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 22px 20px;
            margin-top: 60px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        /* ── ALERTS ─────────────────────────────────────── */
        .alert {
            padding: 14px 18px;
            margin: 20px 0;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* ── GLOBAL BUTTON ──────────────────────────────── */
        button, .btn {
            font-family: 'DM Sans', sans-serif;
            background: var(--accent);
            color: #fff;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        button:hover, .btn:hover {
            background: var(--accent-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* ── FORM ELEMENTS ──────────────────────────────── */
        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            margin: 8px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* ── TABLE ──────────────────────────────────────── */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            margin: 20px 0;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table th {
            background: rgba(59, 130, 246, 0.08);
            color: var(--accent-light);
            padding: 14px 18px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border);
        }

        table td {
            padding: 13px 18px;
            border-bottom: 1px solid rgba(99, 179, 237, 0.05);
            color: var(--text-secondary);
            font-size: 14px;
        }

        table tr:last-child td { border-bottom: none; }

        table tr:hover td {
            background: rgba(59, 130, 246, 0.04);
            color: var(--text-primary);
        }

        /* ── RESPONSIVE ─────────────────────────────────── */
        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                gap: 12px;
                height: auto;
                padding: 14px 0;
            }

            header { height: auto; }

            h1 { font-size: 16px; }

            .nav-buttons {
                width: 100%;
                justify-content: center;
            }

            .nav-btn {
                padding: 7px 11px;
                font-size: 12px;
            }

            .nav-divider { display: none; }
        }

        /* ── PAGE ENTER ANIMATION ───────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        main > * {
            animation: fadeUp 0.4s ease both;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <div class="header-top">
                <div class="header-content">
                    <img src="/static/logo/logoaapm.png" alt="Logo AAPM" class="logo-header">
                    <h1>Gestão de Estoque <span>AAPM</span></h1>
                </div>
                {% if usuario %}
                <div class="nav-buttons">
                    <a href="/" class="nav-btn">
                        <i class="fas fa-house"></i> Home
                    </a>
                    <a href="/cliente" class="nav-btn">
                        <i class="fas fa-users"></i> Clientes
                    </a>
                    <a href="/produtos" class="nav-btn">
                        <i class="fas fa-box-open"></i> Produtos
                    </a>
                    <a href="/categorias" class="nav-btn">
                        <i class="fas fa-tags"></i> Categorias
                    </a>
                    <a href="/usuarios" class="nav-btn">
                        <i class="fas fa-user-gear"></i> Usuários
                    </a>
                    <a href="/movimentacoes" class="nav-btn">
                        <i class="fas fa-exchange-alt"></i> Movimentações
                    </a>
                    <a href="/pdv" class="nav-btn">
                        <i class="fas fa-cash-register"></i> PDV
                    </a>
                    <div class="nav-divider"></div>
                    <a href="/auth/logout" class="nav-btn logout">
                        <i class="fas fa-right-from-bracket"></i> Sair
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Gestão de Estoque AAPM &nbsp;·&nbsp; Todos os direitos reservados.</p>
    </footer>
</body>

</html>
