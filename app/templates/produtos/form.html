{% extends "base.html" %}

{% block title %}Manutenção de Produto - AAPM{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 40px; border-radius: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.25);">
        
        <div style="text-align: center; margin-bottom: 35px;">
            <h2 style="color: #2d3748; font-size: 26px; font-weight: 800;">📝 Detalhes do <span style="color: #667eea;">Produto</span></h2>
            <p style="color: #718096; margin-top: 8px;">Insira as informações técnicas do item.</p>
        </div>

        <form method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; color: #4a5568; font-weight: 700; margin-bottom: 8px;">Nome do Item</label>
                <input type="text" name="nome" placeholder="Ex: Cadeira Ergonômica" required
                       style="width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #edf2f7; outline: none; transition: 0.3s;"
                       onfocus="this.style.borderColor='#667eea'">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px;">
                <div>
                    <label style="display: block; color: #4a5568; font-weight: 700; margin-bottom: 8px;">Categoria</label>
                    <select name="categoria" style="width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #edf2f7; background: white;">
                        <option value="Móveis">Móveis</option>
                        <option value="Eletrónicos">Eletrónicos</option>
                        <option value="Papelaria">Papelaria</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; color: #4a5568; font-weight: 700; margin-bottom: 8px;">Preço Base</label>
                    <input type="number" step="0.01" name="preco" placeholder="0.00"
                           style="width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #edf2f7;">
                </div>
            </div>

            <button type="submit" style="width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(102,126,234,0.3); transition: 0.3s;">
                Salvar Alterações
            </button>
            
            <a href="/produtos" style="display: block; text-align: center; margin-top: 20px; color: #718096; text-decoration: none; font-weight: 600;">Voltar à lista</a>
        </form>
    </div>
</div>
{% endblock %}
